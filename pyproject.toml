[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cocostudio"
version = "0.1.0"
description = "Push COCO predictions to Label Studio for correction and pull refined annotations back."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    #"coconut-crab @ git+https://github.com/WHOIGit/coconut-crab.git",
    #"labelstudio-tools @ git+https://github.com/WHOIGit/labelstudio-tools.git",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "cocostudio",
]
