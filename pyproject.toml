[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sibert-labelstudio-cycle-ff"
version = "0.1.0"
description = "Compare, push, and pull fullframe COCO annotations through Label Studio for Sibert 2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pycocotools",
    "tqdm",
]

[project.optional-dependencies]
labelstudio = [
    "labelstudio-tools @ git+https://github.com/WHOIGit/labelstudio-tools.git",
]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "common",
    "compare",
    "pull",
    "push",
]

