host = "https://labelstudio.brick.whoi.edu"
project = "sam2dirty cleanup - RectangleLabels"
label_config = "RectangleLabels/label-ui_rectanglelabels.xml"
auth = "../ls_auth.toml"

[labelstudio-tools]
pk = "image"
cache = "RAM"
s3_https_suppress = true  # LS server needs https in storage endpoint_url; local boto3 only works with http for vast.whoi.edu

[general]
description = "Used to review fullframe-rois"
task_sampling = "sequential"
color = "#FF4C25"  # Red

[[storage]]
type = "s3"
mode = "source"
title = "ichthyolith storage"
bucket = "ichthyolith"
endpoint_url = "https://vast.whoi.edu"
bucket_prefix = "fullframe_halfsizejpg_cannonical"
presigned_urls = true
presigned_urls_expiry = 15
import_method = "tasks"
file_name_filter = "(?!)"
scan_all_subfolders = true

[ml_backend]
name = "SAM2 BigImg"
backend_url = "https://mlbackend.brick.whoi.edu/SAM2BigImg_brick/"
interactive = true
extra_params = { subpatching = { patch_size = 1024 }, postprocess = { mask_size_threshold = 1, dilate = 0.05 }, output_format = { type = "RectangleLabels" } }
start_training_on_annotation_update = false
annotation_prelabeling = false
exclude_existing_annotations = true

[annotations]
instructions = ""
show_before_labeling = false
