# Render the bundled polygon-mask COCO examples together.
coco_a = "data/example/coco_b.json"
coco_b = "data/example/coco_c.json"
name_a = "example-b"
name_b = "example-c"

image_root = "data/example"
output = "data/example/compare-render/{FFID}.jpg"

image_key = "file_name"
ffid_field = "file_name"

draw_bboxes = true
mask_mode = "both"
invert_masks = "none"

# Format string fields include {CATEGORY}, {ROI}, {OBJ:05}, {OBJ_ID}, and
# other annotation properties.
text = "{SOURCE}:{OBJ:02}.{CATEGORY}"

color_a = "cyan"
color_b = "red"

mask_alpha = 0.33
line_width = 1

clobber = true
dry_run = false
provenance = false

[label_color]
tooth = "lime"
denticle = "dodgerblue"
other = "violet"
