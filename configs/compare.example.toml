coco_a = "data/exports/source-a-coco.json"
coco_b = "data/exports/source-b-coco.json"
name_a = "source-a"
name_b = "source-b"

image_root = "data/images"
output = "data/compare/rendered/{FFID}.jpg"

image_key = "file_name"
ffid_field = "file_name"

draw_bboxes = true
mask_mode = "none"
invert_masks = "none"

# Format string fields include {CATEGORY}, {ROI}, {OBJ:05}, {OBJ_ID}, and
# other annotation properties.
text = false

color_a = "cyan"
color_b = "red"

mask_alpha = 0.28
line_width = 3

clobber = false
dry_run = false
provenance = "data/logs/compare_render_{DATETIME}.json"

[label_color]
tooth = "lime"
denticle = "dodgerblue"
other = "violet"
