# SAM2-Automorph -> "Clean Fullframe ROI's from SAM2-Automorph" (BrushLabels project).
# Pushes bboxes to the `rect` control and segmentations as brush masks to `brush`.
# Replaces the former `sam2dirty.push:push` profile.

ls_config = "configs/labelstudio/BrushLabels/ls_project.sam2-automorph-brushlabels.BRICK.toml"
# s3_prefix omitted -> uses the project's [[storage]].bucket_prefix.
region_id_pattern = "roi_{annotation.meta.roi_id}"

[push]
coco          = "data/from_cleanup/sam2-coco-small.json"
image_dir     = "data/from_cleanup/images-halfsizejpg"
model_version = "sam2-automorph-{info.date_created}"
map_bbox      = "rect"
map_seg       = "brush"
