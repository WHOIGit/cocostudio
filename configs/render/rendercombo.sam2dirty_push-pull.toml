render_a = "configs/render/render.sam2dirty.toml"
render_b = "configs/render/render.sam2dirty.toml"
coco_a = "data/from_cleanup/sam2-coco-small.json"
coco_b = "data/pulled/sam2dirty-rect.reviewed.coco.json"
output = "data/render/combo-push-pull/{FILE_STEM}.jpg"
clobber = true
mask_enable = false
diff_only = true
diff_iou_threshold = 1.0
text = "{AB}:{CATEGORY}:{OBJ_ID:03}"

[style-a]
bbox = "cyan"

[style-b]
bbox = "red"
text_align = "inside"

# Run from the cocostudio/ directory:
# coco-compare render -c configs/render/rendercombo.sam2dirty_push-pull.toml
# coco-compare render -c configs/render/rendercombo.sam2dirty_push-pull.toml --dry-run
